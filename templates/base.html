{% load bootstrap4 %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Learning Log{% endblock %}</title>{% bootstrap_css %}{% bootstrap_javascript jquery='full' %}</head><body class="bg-light"><nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4"><div class="container"><a class="navbar-brand" href="{% url 'learning_logs:index' %}">Learning Log</a><div class="navbar-nav ml-auto">{% if user.is_authenticated %}<span class="navbar-text mr-3">{{ user.username }}</span><a class="nav-link" href="{% url 'learning_logs:topics' %}">Темы</a><form method="post" action="{% url 'users:logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm ml-2" type="submit">Выйти</button></form>{% else %}<a class="nav-link" href="{% url 'users:login' %}">Войти</a><a class="btn btn-light btn-sm ml-2" href="{% url 'users:register' %}">Регистрация</a>{% endif %}</div></div></nav><main class="container pb-5">{% block content %}{% endblock %}</main></body></html>
