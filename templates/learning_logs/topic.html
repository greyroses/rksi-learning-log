{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>{{ topic.text }}</h1><a class="btn btn-success" href="{% url 'learning_logs:new_entry' topic.id %}">+ Новая запись</a></div>{% for entry in entries %}<article class="card my-3"><div class="card-body"><small class="text-muted">{{ entry.date_added|date:'d.m.Y H:i' }}</small><div>{{ entry.text|linebreaksbr }}</div><a class="btn btn-outline-primary btn-sm mt-2" href="{% url 'learning_logs:edit_entry' entry.id %}">Изменить</a></div></article>{% empty %}<div class="alert alert-info mt-3">Записей по этой теме пока нет.</div>{% endfor %}{% endblock %}
