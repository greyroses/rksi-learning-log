{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Темы</h1><a class="btn btn-success" href="{% url 'learning_logs:new_topic' %}">+ Новая тема</a></div><ul class="list-group mt-3">{% for topic in topics %}<li class="list-group-item"><a href="{% url 'learning_logs:topic' topic.id %}">{{ topic.text }}</a></li>{% empty %}<li class="list-group-item">Тем пока нет.</li>{% endfor %}</ul>{% endblock %}
