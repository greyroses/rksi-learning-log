services:
  web:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn learning_log.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 60"
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - learning_log_data:/app/data
    restart: unless-stopped

volumes:
  learning_log_data:
